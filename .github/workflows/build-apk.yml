name: Сборка APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Веб-файлы
        run: mkdir -p www && cp index.html manifest.json sw.js icon-192.png icon-512.png www/
      - name: Android-проект (Capacitor)
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Санскрит в асанах" app.sanskrit.asany --web-dir www
          npx cap add android
          npx cap sync android
      - name: Иконка
        run: |
          for d in android/app/src/main/res/mipmap-*; do
            if [ -f "$d/ic_launcher.png" ]; then
              cp icon-512.png "$d/ic_launcher.png"
              cp icon-512.png "$d/ic_launcher_round.png"
            fi
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - name: Сборка
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk sanskrit-v${{ github.run_number }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Версия ${{ github.run_number }}
          body: Скачайте файл .apk на телефон Android и откройте его, чтобы установить.
          files: sanskrit-v${{ github.run_number }}.apk
