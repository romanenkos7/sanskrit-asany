<body>

<style>
/* Layout: one narrow phone column; sage-tinted ground, ink text, saffron for progress & rewards, teal for actions */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --surface-2:#E3EAE6; --line:#CFD9D4;
  --fg:#1B2826; --muted:#5B6B67;
  --accent:#D9821C; --accent-soft:#F7E3C6; --on-accent:#2A1700;
  --teal:#246A64; --on-teal:#FFFFFF; --teal-soft:#D3E6E3;
  --good:#2E7D4F; --good-soft:#D6EEDD; --bad:#B23B3B; --bad-soft:#F5D9D9;
  --f-display:"Prata", Georgia, "Times New Roman", serif;
  --f-body:"Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111917; --surface:#1A2422; --surface-2:#22302D; --line:#2E3E3A;
  --fg:#E6EDEA; --muted:#97A8A3;
  --accent:#F0A543; --accent-soft:#3A2A14; --on-accent:#221300;
  --teal:#5FB3AA; --on-teal:#0B1A18; --teal-soft:#1D3633;
  --good:#5CC48A; --good-soft:#163323; --bad:#F07C7C; --bad-soft:#3A1C1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111917; --surface:#1A2422; --surface-2:#22302D; --line:#2E3E3A;
  --fg:#E6EDEA; --muted:#97A8A3;
  --accent:#F0A543; --accent-soft:#3A2A14; --on-accent:#221300;
  --teal:#5FB3AA; --on-teal:#0B1A18; --teal-soft:#1D3633;
  --good:#5CC48A; --good-soft:#163323; --bad:#F07C7C; --bad-soft:#3A1C1C; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:520px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:14px 10px}
.top h1{font-size:1.35rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.iconbtn svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stack{display:flex;flex-direction:column;gap:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.stat b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.goal{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.goal i{display:block;height:100%;background:var(--accent);border-radius:3px}
.hero{background:var(--teal);color:var(--on-teal);border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.hero div{flex:1;min-width:0}
.hero b{display:block;font-size:1.1rem}
.hero span{opacity:.85;font-size:.9rem}
.hero .go{font-size:1.4rem}
.label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-top:8px}
.folders{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.folder{display:flex;align-items:center;gap:12px;padding:13px 14px;text-align:left;width:100%;border-top:1px solid var(--line)}
.folder:first-child{border-top:0}
.folder .nm{flex:1;min-width:0}
.folder .nm b{display:block;font-weight:600}
.folder .nm small{color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums}
.ring{width:38px;height:38px;flex:none}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:var(--surface-2)} .ring .fg{stroke:var(--accent);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:.92rem}
.mode svg{width:26px;height:26px;stroke:var(--teal);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.words{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.word{display:flex;gap:10px;align-items:baseline;padding:10px 14px;border-top:1px solid var(--line)}
.word:first-child{border-top:0}
.word .sa{font-family:var(--f-display);font-size:1.05rem;min-width:0;flex:0 1 42%}
.word .ru{color:var(--muted);flex:1;min-width:0;font-size:.92rem}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--surface-2);align-self:center}
.dot.l1{background:var(--accent-soft);border:1px solid var(--accent)} .dot.l2{background:var(--accent)}
.progress-line{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.progress-line .bar{flex:1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.progress-line .bar i{display:block;height:100%;background:var(--teal);transition:width .3s}
/* flashcard */
.card-wrap{perspective:1200px}
.fcard{position:relative;width:100%;min-height:340px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.2,1);cursor:pointer}
.fcard.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;overflow:auto}
.face.back{transform:rotateY(180deg)}
.face .big{font-family:var(--f-display);font-size:2.3rem;line-height:1.15;overflow-wrap:anywhere}
.face .mid{font-size:1.35rem;font-weight:600;overflow-wrap:anywhere}
.face .hint{position:absolute;bottom:14px;font-size:.78rem;color:var(--muted)}
.face .tag{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.ex{font-size:.9rem;color:var(--muted)}
.ex b{color:var(--fg);font-weight:500}
.note{font-size:.88rem;color:var(--muted);font-style:italic}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{padding:14px;border-radius:var(--r);font-weight:600;text-align:center;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--teal);color:var(--on-teal);border-color:var(--teal)}
.btn.know{background:var(--good-soft);color:var(--good);border-color:transparent}
.btn.again{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:default}
/* quiz */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:6px}
.qcard .big{font-family:var(--f-display);font-size:2rem;overflow-wrap:anywhere}
.qcard .mid{font-size:1.25rem;font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-size:1rem}
.opt.sa{font-family:var(--f-display);font-size:1.15rem}
.opt.ok{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}
.opt.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.feedback{border-radius:var(--r);padding:12px 14px;font-size:.92rem}
.feedback.ok{background:var(--good-soft)} .feedback.no{background:var(--bad-soft)}
/* pairs */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{min-height:64px;padding:10px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-size:.92rem;display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere;transition:opacity .25s,transform .15s}
.tile.sa{font-family:var(--f-display);font-size:1.05rem}
.tile.sel{border-color:var(--teal);background:var(--teal-soft);border-width:2px}
.tile.done{opacity:0;pointer-events:none}
.tile.wrong{background:var(--bad-soft);border-color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.timer{font-variant-numeric:tabular-nums;font-weight:600}
/* results */
.result{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.result .score{font-family:var(--f-display);font-size:3rem;line-height:1}
.xp{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--fg);border-radius:999px;padding:5px 12px;font-weight:600;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:.92rem;z-index:20;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgb(0 0 0 / .25);animation:pop .25s}
@keyframes pop{from{transform:translate(-50%,10px);opacity:0}}
.ach{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.badge{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.badge b{display:block;font-size:.95rem}
.badge small{color:var(--muted);font-size:.8rem}
.badge.off{opacity:.45}
.badge.on{border-color:var(--accent);background:var(--accent-soft)}
.lvl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.lvl .t{display:flex;justify-content:space-between;align-items:baseline}
.lvl .t b{font-family:var(--f-display);font-size:1.6rem;font-weight:400}
.confirm{background:var(--bad-soft);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

let S=load();

const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dayNum=s=>Math.round(new Date(s+'T12:00:00').getTime()/864e5);
function card(id){return S.cards[id]||{box:0,due:0,seen:0,right:0}}
function isDue(id){const c=S.cards[id];return c&&c.seen>0&&c.due<=dayNum(today())}
function streak(){
  const set=new Set(S.days);let n=0,d=dayNum(today());
  if(!set.has(today()))d-=1; // streak survives until end of today
  const fmt=x=>{const t=new Date(x*864e5);return t.getUTCFullYear()+'-'+String(t.getUTCMonth()+1).padStart(2,'0')+'-'+String(t.getUTCDate()).padStart(2,'0')};
  while(set.has(fmt(d))){n++;d--}
  return n;
}
function todayCount(){return S.today.date===today()?S.today.count:0}
function level(){let lv=1,need=100,xp=S.xp;while(xp>=need){xp-=need;lv++;need=100+lv*50}return{lv,into:xp,need}}

function record(id,correct,xp){
  const c=card(id);c.seen++;
  if(correct){c.right++;c.box=Math.min(c.box+1,INTERVALS.length-1)}else{c.box=Math.max(0,c.box-2)}
  c.due=dayNum(today())+INTERVALS[c.box];
  S.cards[id]=c;
  if(correct)S.xp+=xp;
  const t=today();
  if(S.today.date!==t)S.today={date:t,count:0};
  S.today.count++;
  if(!S.days.includes(t))S.days.push(t);
  save();checkAch();
}
function addXp(n){S.xp+=n;save()}

/* ---------- achievements ---------- */
const folderLearned=fid=>WORDS.filter(w=>w.folder===fid).every(w=>card(w.id).box>=LEARNED_BOX);
const learnedCount=()=>WORDS.filter(w=>card(w.id).box>=LEARNED_BOX).length;
const ACH=[
  {id:'first',name:'Первый шаг',desc:'Ответить на первую карточку',test:()=>Object.keys(S.cards).length>0},
  {id:'goal',name:'Цель дня',desc:`${DAILY_GOAL} ответов за день`,test:()=>todayCount()>=DAILY_GOAL},
  {id:'s3',name:'Три дня подряд',desc:'Заниматься 3 дня без пропусков',test:()=>streak()>=3},
  {id:'s7',name:'Неделя практики',desc:'Заниматься 7 дней без пропусков',test:()=>streak()>=7},
  {id:'perfect',name:'Без ошибок',desc:'Пройти тест из 10 вопросов на 10/10',test:()=>!!S.ach._perfect},
  {id:'fast',name:'Быстрые пары',desc:'Собрать 6 пар быстрее 30 секунд',test:()=>!!S.ach._fast},
  {id:'numbers',name:'Эка, дви, три',desc:'Выучить все числительные',test:()=>folderLearned('numbers')},
  {id:'body',name:'От пады до ширши',desc:'Выучить все части тела',test:()=>folderLearned('body')},
  {id:'zoo',name:'Зоопарк асан',desc:'Выучить всех животных и птиц',test:()=>folderLearned('animals')&&folderLearned('birds')},
  {id:'w50',name:'50 слов',desc:'Выучить 50 слов',test:()=>learnedCount()>=50},
  {id:'half',name:'Половина пути',desc:'Выучить половину словаря',test:()=>learnedCount()>=Math.ceil(WORDS.length/2)},
  {id:'all',name:'Пурна',desc:'Выучить весь словарь',test:()=>learnedCount()>=WORDS.length},
];
function checkAch(){
  for(const a of ACH){if(!S.ach[a.id]&&a.test()){S.ach[a.id]=today();save();toast('Достижение: '+a.name)}}
}
let toastT;
function toast(msg){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),2600)}

/* ---------- helpers ---------- */
const $app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ICON={
  back:'<path d="M15 18l-6-6 6-6"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  cards:'<rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/>',
  quiz:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01"/>',
  pairs:'<rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/><path d="M13 7h4a2 2 0 0 1 2 2v2M11 17H7a2 2 0 0 1-2-2v-2"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>'
};
const ic=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
function hdr(title,{back=null,right=''}={}){
  return `<header class="top">${back?`<button class="iconbtn" data-act="${back}" aria-label="Назад">${ic('back')}</button>`:''}<h1>${esc(title)}</h1>${right}</header>`;
}
function wordsOf(scope){return scope==='all'?WORDS:scope==='due'?WORDS.filter(w=>isDue(w.id)):WORDS.filter(w=>w.folder===scope)}
function scopeName(scope){return scope==='all'?'Все слова':scope==='due'?'Повторение':FOLDERS.find(f=>f.id===scope).name}
function examplesHtml(w){return w.examples.length?`<div class="ex">${w.examples.map(e=>`<b>${esc(e)}</b>`).join(' · ')}</div>`:''}
function ring(p){const r=15,c=2*Math.PI*r;return `<svg class="ring" viewBox="0 0 38 38" aria-hidden="true"><circle class="bg" cx="19" cy="19" r="${r}"/><circle class="fg" cx="19" cy="19" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}"/></svg>`}
// order words for a study session: due first, then new, then the rest
function sessionOrder(list){
  const due=[],fresh=[],rest=[];
  for(const w of list){const c=S.cards[w.id];if(!c||!c.seen)fresh.push(w);else if(isDue(w.id))due.push(w);else rest.push(w)}
  return [...shuffle(due),...shuffle(fresh),...shuffle(rest)];
}

/* ---------- screens ---------- */
let view={name:'home'};
let dir=(()=>{try{return localStorage.getItem(KEY+'-dir')||'sa'}catch(e){return 'sa'}})(); // sa: санскрит→перевод, ru: перевод→санскрит, mix
function setDir(d){dir=d;try{localStorage.setItem(KEY+'-dir',d)}catch(e){}}
function go(v){view=v;render();window.scrollTo(0,0)}

function render(){
  ({home,folder,cards,quiz,pairs,progress})[view.name]();
}

function home(){
  const st=streak(),tc=todayCount(),due=WORDS.filter(w=>isDue(w.id)).length,lv=level();
  const learned=learnedCount();
  $app.innerHTML=hdr('Санскрит в асанах',{right:`<button class="iconbtn" data-act="progress" aria-label="Прогресс">${ic('chart')}</button>`})+`
  <div class="stack">
    <div class="stats">
      <div class="stat"><b>${st}</b><span>${plural(st,'день','дня','дней')} подряд</span></div>
      <div class="stat"><b>${Math.min(tc,DAILY_GOAL)}/${DAILY_GOAL}</b><span>цель дня</span><div class="goal"><i style="width:${Math.min(100,tc/DAILY_GOAL*100)}%"></i></div></div>
      <div class="stat"><b>${lv.lv}</b><span>уровень · ${S.xp} XP</span></div>
    </div>
    ${due?`<button class="hero" data-act="scope" data-scope="due"><div><b>Повторить ${due} ${plural(due,'слово','слова','слов')}</b><span>Пора освежить в памяти</span></div><span class="go">→</span></button>`
         :`<button class="hero" data-act="scope" data-scope="all"><div><b>Все слова</b><span>Выучено ${learned} из ${WORDS.length}</span></div><span class="go">→</span></button>`}
    <div class="label">Папки</div>
    <div class="folders">
      ${due?folderRow('all','Все слова',WORDS):''}
      ${FOLDERS.map(f=>folderRow(f.id,f.name,WORDS.filter(w=>w.folder===f.id))).join('')}
    </div>
  </div>`;
}
function folderRow(id,name,list){
  const l=list.filter(w=>card(w.id).box>=LEARNED_BOX).length;
  return `<button class="folder" data-act="scope" data-scope="${id}">${ring(list.length?l/list.length:0)}<div class="nm"><b>${esc(name)}</b><small>${l} из ${list.length} выучено</small></div><span aria-hidden="true">›</span></button>`;
}
function plural(n,a,b,c){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c}

function folder(){
  const sc=view.scope,list=wordsOf(sc);
  if(!list.length){go({name:'home'});return}
  const l=list.filter(w=>card(w.id).box>=LEARNED_BOX).length;
  $app.innerHTML=hdr(scopeName(sc),{back:'home'})+`
  <div class="stack">
    <div class="progress-line"><div class="bar"><i style="width:${l/list.length*100}%"></i></div>${l}/${list.length}</div>
    <div class="modes">
      <button class="mode" data-act="cards">${ic('cards')}Карточки</button>
      <button class="mode" data-act="quiz" ${list.length<2&&sc!=='due'?'disabled':''}>${ic('quiz')}Тест</button>
      <button class="mode" data-act="pairs">${ic('pairs')}Пары</button>
    </div>
    <div class="label">Направление</div>
    <div class="seg" role="group" aria-label="Направление">
      <button data-act="dir" data-dir="sa" aria-pressed="${dir==='sa'}">Санскрит → рус</button>
      <button data-act="dir" data-dir="ru" aria-pressed="${dir==='ru'}">Рус → санскрит</button>
      <button data-act="dir" data-dir="mix" aria-pressed="${dir==='mix'}">Вперемешку</button>
    </div>
    <div class="label">Слова</div>
    <div class="words">${list.map(w=>{const b=card(w.id).box;return `<div class="word"><span class="dot ${b>=LEARNED_BOX?'l2':b>0?'l1':''}" title="${b>=LEARNED_BOX?'выучено':b>0?'в процессе':'новое'}"></span><span class="sa">${esc(w.word)}</span><span class="ru">${esc(w.translation)}</span></div>`}).join('')}</div>
  </div>`;
}

/* flashcards */
function cards(){
  if(!view.queue){view.queue=sessionOrder(wordsOf(view.scope));view.i=0;view.known=0;view.xp=0;view.flipped=false}
  const q=view.queue;
  if(view.i>=q.length){
    $app.innerHTML=hdr(scopeName(view.scope),{back:'folder'})+resultHtml(`${view.known}/${q.length}`,'карточек вы знали',view.xp,'cards');return;
  }
  const w=q[view.i];
  const d=dir==='mix'?(w.id.charCodeAt(w.id.length-1)%2?'sa':'ru'):dir;
  const front=d==='sa'?`<div class="tag">Что значит</div><div class="big">${esc(w.word)}</div>`:`<div class="tag">Как на санскрите</div><div class="mid">${esc(w.translation)}</div>`;
  const back=`<div class="big">${esc(w.word)}</div><div class="mid">${esc(w.translation)}</div>${examplesHtml(w)}${w.note?`<div class="note">${esc(w.note)}</div>`:''}`;
  $app.innerHTML=hdr(scopeName(view.scope),{back:'folder'})+`
  <div class="stack">
    <div class="progress-line"><div class="bar"><i style="width:${view.i/q.length*100}%"></i></div>${view.i+1}/${q.length}</div>
    <div class="card-wrap"><div class="fcard ${view.flipped?'flipped':''}" data-act="flip" role="button" tabindex="0" aria-label="Перевернуть карточку">
      <div class="face front">${front}<div class="hint">Нажмите, чтобы перевернуть</div></div>
      <div class="face back">${back}</div>
    </div></div>
    <div class="row2">
      <button class="btn again" data-act="answer" data-ok="0" ${view.flipped?'':'disabled'}>Ещё учу</button>
      <button class="btn know" data-act="answer" data-ok="1" ${view.flipped?'':'disabled'}>Знаю</button>
    </div>
  </div>`;
}

/* quiz */
function makeQuestion(w,pool){
  const d=dir==='mix'?(Math.random()<.5?'sa':'ru'):dir;
  // distractors: not the same word text, not the same translation (avoid two right answers)
  const ok=x=>x.id!==w.id&&x.word!==w.word&&x.translation!==w.translation;
  let cand=shuffle(pool.filter(ok));
  if(cand.length<3)cand=cand.concat(shuffle(WORDS.filter(x=>ok(x)&&!cand.includes(x))));
  const seen=new Set([d==='sa'?w.translation:w.word]);const dis=[];
  for(const x of cand){const k=d==='sa'?x.translation:x.word;if(!seen.has(k)){seen.add(k);dis.push(x)}if(dis.length===3)break}
  return{w,d,opts:shuffle([w,...dis])};
}
function quiz(){
  if(!view.qs){
    const list=wordsOf(view.scope);
    const pick=sessionOrder(list).slice(0,Math.min(10,list.length));
    view.qs=shuffle(pick).map(w=>makeQuestion(w,list));view.i=0;view.right=0;view.xp=0;view.picked=null;
  }
  const qs=view.qs;
  if(view.i>=qs.length){
    if(qs.length>=10&&view.right===qs.length&&!S.ach._perfect){S.ach._perfect=1;save();checkAch()}
    $app.innerHTML=hdr('Тест · '+scopeName(view.scope),{back:'folder'})+resultHtml(`${view.right}/${qs.length}`,'правильных ответов',view.xp,'quiz');return;
  }
  const q=qs[view.i],w=q.w,ans=view.picked!=null;
  const prompt=q.d==='sa'?`<div class="tag">Что значит</div><div class="big">${esc(w.word)}</div>`:`<div class="tag">Как на санскрите</div><div class="mid">${esc(w.translation)}</div>`;
  const opts=q.opts.map((o,i)=>{
    let cls='opt'+(q.d==='ru'?' sa':'');
    if(ans){if(o.id===w.id)cls+=' ok';else if(i===view.picked)cls+=' no'}
    return `<button class="${cls}" data-act="pick" data-i="${i}" ${ans?'disabled':''}>${esc(q.d==='sa'?o.translation:o.word)}</button>`}).join('');
  const correct=ans&&q.opts[view.picked].id===w.id;
  $app.innerHTML=hdr('Тест · '+scopeName(view.scope),{back:'folder'})+`
  <div class="stack">
    <div class="progress-line"><div class="bar"><i style="width:${view.i/qs.length*100}%"></i></div>${view.i+1}/${qs.length}</div>
    <div class="qcard">${prompt}</div>
    <div class="opts">${opts}</div>
    ${ans?`<div class="feedback ${correct?'ok':'no'}"><b>${correct?'Верно! +10 XP':'Не совсем.'}</b> ${esc(w.word)} — ${esc(w.translation)}${w.examples.length?'<br>'+w.examples.map(esc).join(' · '):''}</div>
    <button class="btn primary" data-act="next">${view.i+1<qs.length?'Дальше':'Результат'}</button>`:''}
  </div>`;
}

/* pairs */
function pairs(){
  if(!view.tiles){
    const list=wordsOf(view.scope);const chosen=[];const usedW=new Set(),usedT=new Set();
    for(const w of shuffle(list)){if(usedW.has(w.word)||usedT.has(w.translation))continue;usedW.add(w.word);usedT.add(w.translation);chosen.push(w);if(chosen.length===6)break}
    if(chosen.length<6)for(const w of shuffle(WORDS)){if(chosen.length===6)break;if(usedW.has(w.word)||usedT.has(w.translation))continue;usedW.add(w.word);usedT.add(w.translation);chosen.push(w)}
    view.left=shuffle(chosen).map(w=>({id:w.id,t:w.word,side:'sa'}));
    view.right=shuffle(chosen).map(w=>({id:w.id,t:w.translation,side:'ru'}));
    view.tiles=true;view.done=new Set();view.sel=null;view.miss=0;view.start=Date.now();view.wrong=null;
    clearInterval(view.tick);view.tick=setInterval(()=>{const el=document.querySelector('.timer');if(el&&view.name==='pairs')el.textContent=fmtTime(Date.now()-view.start)},250);
  }
  if(view.done.size===view.left.length){
    clearInterval(view.tick);
    if(!view.final){
      const ms=Date.now()-view.start;const gain=Math.max(5,30-view.miss*5);addXp(gain);
      const key=view.scope;const prev=S.best[key];const rec=!prev||ms<prev;if(rec){S.best[key]=ms}
      if(ms<30000&&!S.ach._fast){S.ach._fast=1}
      const t=today();if(S.today.date!==t)S.today={date:t,count:0};if(!S.days.includes(t))S.days.push(t);
      save();checkAch();view.final={ms,gain,rec};
    }
    const f=view.final;
    $app.innerHTML=hdr('Пары · '+scopeName(view.scope),{back:'folder'})+resultHtml(fmtTime(f.ms),(f.rec?'новый рекорд! ':'')+`ошибок: ${view.miss}`+(S.best[view.scope]&&!f.rec?` · рекорд ${fmtTime(S.best[view.scope])}`:''),f.gain,'pairs');return;
  }
  const tile=(x,col)=>{const k=col+x.id;let cls='tile'+(x.side==='sa'?' sa':'');if(view.done.has(x.id))cls+=' done';if(view.sel===k)cls+=' sel';if(view.wrong&&view.wrong.includes(k))cls+=' wrong';return `<button class="${cls}" data-act="tile" data-k="${k}">${esc(x.t)}</button>`};
  let html='';for(let i=0;i<view.left.length;i++)html+=tile(view.left[i],'L')+tile(view.right[i],'R');
  $app.innerHTML=hdr('Пары · '+scopeName(view.scope),{back:'folder',right:`<span class="timer">${fmtTime(Date.now()-view.start)}</span>`})+`
  <div class="stack"><div class="ex">Соедините слово с переводом. Ошибок: ${view.miss}</div><div class="pairs">${html}</div></div>`;
}
const fmtTime=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

function resultHtml(score,sub,xp,again){
  return `<div class="stack"><div class="result"><div class="score">${esc(score)}</div><div class="ex">${esc(sub)}</div>${xp?`<span class="xp">+${xp} XP</span>`:''}</div>
  <div class="row2"><button class="btn" data-act="folder">К папке</button><button class="btn primary" data-act="${again}" data-restart="1">Ещё раз</button></div></div>`;
}

function progress(){
  const lv=level(),learned=learnedCount();
  $app.innerHTML=hdr('Прогресс',{back:'home'})+`
  <div class="stack">
    <div class="lvl"><div class="t"><b>Уровень ${lv.lv}</b><span class="ex">${S.xp} XP</span></div>
      <div class="progress-line"><div class="bar"><i style="width:${lv.into/lv.need*100}%"></i></div>${lv.into}/${lv.need}</div>
      <div class="ex">Выучено ${learned} из ${WORDS.length} слов · серия ${streak()} ${plural(streak(),'день','дня','дней')}</div></div>
    <div class="label">Достижения · ${ACH.filter(a=>S.ach[a.id]).length} из ${ACH.length}</div>
    <div class="ach">${ACH.map(a=>`<div class="badge ${S.ach[a.id]?'on':'off'}"><b>${esc(a.name)}</b><small>${esc(a.desc)}</small></div>`).join('')}</div>
    <div class="label">Как это работает</div>
    <div class="ex">Слово считается выученным, когда вы правильно ответили на него 3 раза подряд в разные дни. Забытые слова возвращаются на повторение чаще. Прогресс хранится только на этом устройстве.</div>
    ${view.confirm?`<div class="confirm"><b>Удалить весь прогресс?</b><span class="ex">Очки, серия, достижения и статусы слов обнулятся. Это нельзя отменить.</span><div class="row2"><button class="btn" data-act="noreset">Отмена</button><button class="btn again" data-act="doreset">Удалить</button></div></div>`
      :`<button class="btn ghost" data-act="reset">Сбросить прогресс</button>`}
  </div>`;
}

/* ---------- events ---------- */
$app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(a==='home')go({name:'home'});
  else if(a==='progress')go({name:'progress'});
  else if(a==='scope')go({name:'folder',scope:b.dataset.scope});
  else if(a==='folder'){clearInterval(view.tick);go({name:'folder',scope:view.scope})}
  else if(a==='dir'){setDir(b.dataset.dir);render()}
  else if(a==='cards'||a==='quiz'||a==='pairs'){clearInterval(view.tick);go({name:a,scope:view.scope})}
  else if(a==='flip'){view.flipped=!view.flipped;document.querySelector('.fcard').classList.toggle('flipped',view.flipped);document.querySelectorAll('[data-act="answer"]').forEach(x=>x.disabled=!view.flipped)}
  else if(a==='answer'){const ok=b.dataset.ok==='1';const w=view.queue[view.i];record(w.id,ok,2);if(ok){view.known++;view.xp+=2}view.i++;view.flipped=false;render()}
  else if(a==='pick'){const q=view.qs[view.i];view.picked=+b.dataset.i;const ok=q.opts[view.picked].id===q.w.id;record(q.w.id,ok,10);if(ok){view.right++;view.xp+=10}render()}
  else if(a==='next'){view.i++;view.picked=null;render()}
  else if(a==='tile'){
    const k=b.dataset.k;if(view.wrong)return;
    if(!view.sel){view.sel=k;render();return}
    if(view.sel===k){view.sel=null;render();return}
    if(view.sel[0]===k[0]){view.sel=k;render();return}
    if(view.sel.slice(1)===k.slice(1)){view.done.add(k.slice(1));view.sel=null;render()}
    else{view.miss++;view.wrong=[view.sel,k];view.sel=null;render();setTimeout(()=>{view.wrong=null;if(view.name==='pairs')render()},450)}
  }
  else if(a==='reset'){view.confirm=true;render()}
  else if(a==='noreset'){view.confirm=false;render()}
  else if(a==='doreset'){S={cards:{},xp:0,days:[],today:{date:'',count:0},ach:{},best:{}};save();view.confirm=false;toast('Прогресс удалён');render()}
});
$app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.fcard')){e.preventDefault();e.target.click()}});
